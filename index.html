<!doctype html>
<html lang="en">
<head>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">

  <title>Vilna Daf Studio — Build 59 Studio</title>

    <div class="brand">

      </select>
      <button id="openDirect" type="button">Open full page</button>
    </div>
  </header>

  <main class="studio-frame-wrap">
    <iframe
      id="studioFrame"
      title="Selected Vilna Daf Studio amud"
      allow="microphone"
    ></iframe>
  </main>

  <script src="launcher.js?build=59"></script>
