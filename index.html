<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Vilna Daf Studio — Build 60 Draft</title>
  <link rel="stylesheet" href="launcher.css?build=62.70">
</head>
<body>
  <header class="launcher-bar">
    <div class="brand">
      <span class="brand-name">Vilna Daf Studio</span>
      <span class="build-badge">Build 60 Draft</span>
    </div>

    <div class="page-navigation">
      <button id="pageMenuToggle" type="button" aria-label="Choose masechta and amud" aria-expanded="false" aria-controls="pageMenu">
        <img src="assets/gemara-cover.png" alt="" width="30" height="43">
        <span>Choose amud ▾</span>
      </button>
      <div class="page-picker" id="pageMenu" hidden>
      <label class="tractate-picker">Berachos
        <select id="berachosSelect" aria-label="Berachos page"><option value="">Choose amud</option></select>
      </label>
      <label class="tractate-picker">Pesachim
        <select id="pesachimSelect" aria-label="Pesachim page"><option value="">Choose amud</option></select>
      </label>
      <label class="tractate-picker">Bava Metzia
        <select id="bavaMetziaSelect" aria-label="Bava Metzia page"><option value="">Choose amud</option></select>
      </label>
      <button id="newAmud" type="button">New amud</button>
      <button id="openDirect" type="button">Open full page</button>
      </div>
    </div>
  </header>

  <main class="studio-frame-wrap">
    <iframe
      id="studioFrame"
      title="Selected Vilna Daf Studio amud"
      allow="microphone"
    ></iframe>
  </main>

  <script src="launcher.js?build=62.70"></script>
</body>
</html>
