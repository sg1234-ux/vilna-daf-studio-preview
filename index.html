<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Vilna Daf Studio — Build 60 Draft</title>
  <link rel="stylesheet" href="launcher.css?build=62.76">
</head>
<body>
  <header class="launcher-bar">
    <div class="brand">
      <span class="brand-name">Vilna Daf Studio</span>
      <span class="build-badge">Build 60 Draft</span>
    </div>

    <div class="page-navigation">
      <span id="currentApproval" class="approval-badge" hidden title="Saved approved layout">✓ Approved</span>
      <button id="pageMenuToggle" type="button" aria-label="Choose masechta and amud" aria-expanded="false" aria-controls="pageMenu">
        <img src="assets/gemara-cover.svg" alt="" width="44" height="74">
        <span><strong>Shas Bavli</strong><small>Choose daf ▾</small></span>
      </button>
      <div class="page-picker" id="pageMenu" hidden>
      <label class="tractate-picker">Masechta
        <select id="tractateSelect" aria-label="Masechta"></select>
      </label>
      <label class="tractate-picker">Daf / amud
        <select id="amudSelect" aria-label="Daf and amud"></select>
      </label>
      <p class="page-menu-note">All Shas Bavli pages. Only some pages have prepared scan instructions; other selections open the builder.</p>
      <button id="newAmud" type="button">New amud</button>
      <button id="openDirect" type="button">Open full page</button>
      </div>
    </div>
  </header>

  <main class="studio-frame-wrap">
    <iframe
      id="studioFrame"
      title="Selected Vilna Daf Studio amud"
      allow="microphone"
    ></iframe>
  </main>

  <script src="launcher.js?build=62.76"></script>
</body>
</html>
